/div><p id="bootStatus" class="hint muted">INITIALIZING...</p><button class="primary hidden" id="closeModal">CONTINUE</button></div></div><script>
'use strict';
const STORE='cartridge5000.v1';let state={cartridges:{},progress:{},active:null,profile:'default',page:'library',filter:'all',search:'',skin:'nes'};try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&typeof s==='object')state={...state,...s,page:'library',filter:'all',search:''}}catch{};
const SKINS=new Set(['nes','snes','n64','genesis','gamecube','xbox','ps1','ps2','dreamcast']);if(!SKINS.has(state.skin))state.skin='nes';document.body.dataset.skin=state.skin;document.querySelector('#skinSelect').value=state.skin;document.querySelector('#skinSelect').addEventListener('change',e=>{state.skin=SKINS.has(e.target.value)?e.target.value:'nes';document.body.dataset.skin=state.skin;persist()});const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{try{localStorage.setItem(STORE,JSON.stringify({...state,page:'library',search:''}))}catch(e){alert('SAVE FAILED: Browser storage may be full. Export a backup.')}};const game=()=>state.cartridges[state.active];const pkey=()=>state.profile+'::'+state.active;const checks=()=>state.progress[pkey()]||{};const entries=()=>game()?.entries||[];const pct=(n,t)=>t?Math.round(100*n/t):0;
function validate(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('CARTRIDGE MANIFEST MISSING');if(raw.format!=='gcart-1')throw Error('UNSUPPORTED CARTRIDGE FORMAT: expected gcart-1');if(typeof raw.id!=='string'||!/^[a-z0-9][a-z0-9._-]{2,79}$/.test(raw.id))throw Error('INVALID CARTRIDGE ID');if(typeof raw.title!=='string'||!raw.title.trim()||raw.title.length>120)throw Error('INVALID GAME TITLE');if(!Array.isArray(raw.entries))throw Error('CHECKLIST DATABASE NOT FOUND');if(raw.entries.length>10000)throw Error('CARTRIDGE CAPACITY EXCEEDED');const ids=new Set();for(const [i,e] of raw.entries.entries()){if(!e||typeof e!=='object'||typeof e.id!=='string'||!/^[a-zA-Z0-9._-]{1,100}$/.test(e.id)||ids.has(e.id))throw Error('INVALID OR DUPLICATE ENTRY ID AT INDEX '+i);ids.add(e.id);if(typeof e.title!=='string'||!e.title.trim()||e.title.length>250)throw Error('INVALID ENTRY TITLE AT INDEX '+i);for(const k of ['category','region','description'])if(e[k]!=null&&typeof e[k]!=='string')throw Error('INVALID '+k.toUpperCase()+' AT INDEX '+i)}return {format:'gcart-1',id:raw.id,title:raw.title,edition:typeof raw.edition==='string'?raw.edition.slice(0,100):'',version:typeof raw.version==='string'?raw.version.slice(0,30):'1.0',sections:Array.isArray(raw.sections)?raw.sections.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string').slice(0,100).map(x=>({id:x.id.slice(0,100),title:x.title.slice(0,100),categories:Array.isArray(x.categories)?x.categories.filter(y=>typeof y==='string').slice(0,100):[],children:Array.isArray(x.children)?x.children.filter(y=>y&&typeof y.id==='string'&&typeof y.title==='string').slice(0,100).map(y=>({id:y.id.slice(0,100),title:y.title.slice(0,100),categories:Array.isArray(y.categories)?y.categories.filter(z=>typeof z==='string').slice(0,100):[]})):[]})):[],entries:raw.entries.map(e=>({id:e.id,title:e.title,category:(e.category||'General').slice(0,100),region:(e.region||'').slice(0,100),description:(e.description||'').slice(0,10000)}))}}
function show(page){if(!game()&&(page==='dashboard'||page==='checklist'||page.startsWith('section:')))page='library';state.page=page;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
function gameSections(g){if(!g)return [];return g.sections?.length?g.sections:[...new Set(g.entries.map(x=>x.category))].map((cat,i)=>({id:'auto-'+i,title:cat,categories:[cat],children:[]}))}
function navRender(){const g=game(),sections=gameSections(g);$('#gameNav').innerHTML=g?'<div class="sectiontitle">GAME SECTIONS</div>'+sections.map(sec=>'<button class="nav '+(state.page==='section:'+sec.id?'active':'')+'" data-section="'+esc(sec.id)+'">▸ '+esc(sec.title)+'</button>'+sec.children.map(child=>'<button class="subnav '+(state.page==='section:'+sec.id+'/'+child.id?'active':'')+'" data-section="'+esc(sec.id+'/'+child.id)+'">↳ '+esc(child.title)+'</button>').join('')).join(''):'';document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>show('section:'+b.dataset.section))}
function render(){const g=game(),e=entries(),c=checks(),done=e.filter(x=>c[x.id]).length;navRender();$('#slot').innerHTML=g?'<strong>'+esc(g.title)+'</strong><div class="tiny">'+esc(g.edition||'GAME CARTRIDGE')+'<br>VERSION '+esc(g.version)+'</div>':'NO CARTRIDGE INSERTED';$('#profile').value=state.profile;let html='';if(state.page==='library'){html='<h1 class="heading">CARTRIDGE LIBRARY</h1><p class="muted">Insert a .gcart or JSON cartridge. Game content lives in the cartridge; progress stays in your player slot.</p><div class="cards">'+Object.values(state.cartridges).map(x=>'<div class="card"><h3>'+esc(x.title)+'</h3><p class="hint">'+esc(x.edition||'GAME')+' · '+x.entries.length+' TASKS</p><button data-activate="'+esc(x.id)+'" '+(x.id===state.active?'disabled':'')+'>'+(x.id===state.active?'● INSERTED':'INSERT')+'</button> <button data-eject="'+esc(x.id)+'" '+(x.id!==state.active?'disabled':'')+'>EJECT</button> <button data-remove="'+esc(x.id)+'">REMOVE</button></div>').join('')+'</div>';if(!Object.keys(state.cartridges).length)html+='<div class="empty">NO CARTRIDGES INSTALLED<br><br>INSERT A CARTRIDGE OR TRY THE DEMONSTRATION.</div>';html+='<div class="toolbar"><button id="demo">LOAD DEMO CARTRIDGE</button><button id="exportCart" '+(!g?'disabled':'')+'>EXPORT CURRENT CARTRIDGE</button></div><p class="hint muted">The demo is fictional sample content, not an Ocarina of Time walkthrough.</p>'}else if(state.page==='dashboard'){html='<h1 class="heading">PLAYER DASHBOARD</h1>';if(!g)html+='<div class="empty">INSERT A CARTRIDGE TO BEGIN</div>';else{let cats=[...new Set(e.map(x=>x.category))];html+='<h2>'+esc(g.title)+'</h2><div class="cards"><div class="card"><h3>OVERALL COMPLETION</h3><div class="stat">'+pct(done,e.length)+'%</div><div class="progress"><div style="width:'+pct(done,e.length)+'%"></div></div><p>'+done+' / '+e.length+' COMPLETE</p></div><div class="card"><h3>PLAYER SLOT</h3><div class="stat">'+esc(state.profile==='default'?'A':state.profile==='slot-b'?'B':'C')+'</div><p>INDEPENDENT SAVE DATA</p></div><div class="card"><h3>REMAINING</h3><div class="stat">'+(e.length-done)+'</div><p>OBJECTIVES</p></div></div><h2>BY CATEGORY</h2><div class="cards">'+cats.map(cat=>{const list=e.filter(x=>x.category===cat),n=list.filter(x=>c[x.id]).length;return '<div class="card"><h3>'+esc(cat)+'</h3><div class="stat">'+pct(n,list.length)+'%</div><div class="progress"><div style="width:'+pct(n,list.length)+'%"></div></div><p>'+n+' / '+list.length+'</p><button data-category="'+esc(cat)+'">OPEN LIST</button></div>'}).join('')+'</div>'}}else if(state.page.startsWith('section:')){const path=state.page.slice(8).split('/'),sec=gameSections(g).find(x=>x.id===path[0]),node=path[1]?sec?.children.find(x=>x.id===path[1]):sec;const cats=node?.categories||[];const subset=e.filter(x=>cats.includes(x.category));const n=subset.filter(x=>c[x.id]).length;html='<h1 class="heading">'+esc(node?.title||'SECTION NOT FOUND')+'</h1><p class="muted">'+n+' / '+subset.length+' COMPLETE · '+pct(n,subset.length)+'%</p><div class="progress"><div style="width:'+pct(n,subset.length)+'%"></div></div><div class="toolbar"><input id="search" placeholder="SEARCH THIS SECTION..." value="'+esc(state.search)+'"></div>'+subset.filter(x=>[x.title,x.description,x.region].join(' ').toLowerCase().includes(state.search.toLowerCase())).map(x=>'<label class="entry"><input type="checkbox" data-check="'+esc(x.id)+'" '+(c[x.id]?'checked':'')+'><span class="entrymain"><span class="entrytitle">'+esc(x.title)+'</span> '+(x.region?'<span class="chip">'+esc(x.region)+'</span>':'')+'<div class="entrydesc">'+esc(x.description)+'</div></span></label>').join('');if(!subset.length)html+='<div class="empty">NO OBJECTIVES IN THIS SECTION YET</div>'}else if(state.page==='checklist'){html='<h1 class="heading">CHECKLIST DATABASE</h1>';if(!g)html+='<div class="empty">INSERT A CARTRIDGE TO BEGIN</div>';else{let cats=[...new Set(e.map(x=>x.category))],filtered=e.filter(x=>(state.filter==='all'||x.category===state.filter)&&[x.title,x.description,x.region,x.category].join(' ').toLowerCase().includes(state.search.toLowerCase()));html+='<p class="muted">'+done+' / '+e.length+' COMPLETE · '+pct(done,e.length)+'%</p><div class="toolbar"><input id="search" placeholder="SEARCH OBJECTIVES..." value="'+esc(state.search)+'"><select id="category"><option value="all">ALL CATEGORIES</option>'+cats.map(cat=>'<option value="'+esc(cat)+'" '+(state.filter===cat?'selected':'')+'>'+esc(cat)+'</option>').join('')+'</select><button id="showMissing">SHOW MISSING</button></div><div id="entrylist">'+filtered.map(x=>'<label class="entry"><input type="checkbox" data-check="'+esc(x.id)+'" '+(c[x.id]?'checked':'')+'><span class="entrymain"><span class="entrytitle">'+esc(x.title)+'</span> '+(x.region?'<span class="chip">'+esc(x.region)+'</span>':'')+'<div class="entrydesc">'+esc(x.description)+'</div></span></label>').join('')+'</div>';if(!filtered.length)html+='<div class="empty">NO MATCHING OBJECTIVES</div>'}}else{html='<h1 class="heading">SYSTEM CONFIGURATION</h1><h2>DATA MANAGEMENT</h2><p class="hint">Player progress is saved in this browser. Export backups to move between browsers or protect against cleared site data.</p><div class="toolbar"><button id="backup">EXPORT FULL BACKUP</button><button id="restore">IMPORT BACKUP</button><input class="fileinput" type="file" id="backupfile" accept=".json"></div><details><summary>CARTRIDGE SPECIFICATION · GCART-1</summary><p class="hint">A cartridge is a UTF-8 JSON file with a <code>.gcart</code> extension. Required fields: <code>format</code>, <code>id</code>, <code>title</code>, and <code>entries</code>. Every entry requires a stable unique <code>id</code> and <code>title</code>. Optional fields: <code>category</code>, <code>region</code>, <code>description</code>, and <code>sections</code> (navigation sections with category mappings and optional children). IDs must remain stable across cartridge updates to preserve checked progress.</p><textarea readonly>{\n  "format": "gcart-1",\n  "id": "sample.game",\n  "title": "Sample Game",\n  "version": "1.0",\n  "entries": [\n    {"id":"quest.001","title":"Find the key", "category":"Story", "region":"Village", "description":"Walk north and speak to the guard."}\n  ]\n}</textarea></details><details><summary>HOST DIAGNOSTICS</summary><p id="osinfo" class="hint"></p></details><div class="toolbar"><button id="clearSlot">RESET CURRENT PLAYER SLOT</button></div>'}$('#main').innerHTML=html;attach()}
function attach(){document.querySelectorAll('[data-activate]').forEach(b=>b.onclick=()=>{state.active=b.dataset.activate;state.filter='all';persist();show('dashboard')});document.querySelectorAll('[data-eject]').forEach(b=>b.onclick=()=>{if(state.active!==b.dataset.eject)return;state.active=null;state.filter='all';state.search='';persist();show('library')});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('REMOVE THIS CARTRIDGE FROM THE LIBRARY? Saved progress will be retained.')){delete state.cartridges[b.dataset.remove];if(state.active===b.dataset.remove)state.active=null;state.filter='all';state.search='';persist();show('library')}});document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.category;show('checklist')});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{const p=checks();p[b.dataset.check]=b.checked;state.progress[pkey()]=p;persist();render()});if($('#search'))$('#search').oninput=e=>{state.search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(state.search.length,state.search.length)};if($('#category'))$('#category').onchange=e=>{state.filter=e.target.value;render()};if($('#showMissing'))$('#showMissing').onclick=()=>{const list=$('#entrylist');if(!list)return;const hidden=list.dataset.missing==='1';list.dataset.missing=hidden?'0':'1';list.querySelectorAll('.entry').forEach(el=>el.style.display=hidden||!el.querySelector('input').checked?'':'none');$('#showMissing').textContent=hidden?'SHOW MISSING':'SHOW ALL'};if($('#demo'))$('#demo').onclick=()=>install({format:'gcart-1',id:'demo.test',title:'DEMONSTRATION CARTRIDGE',edition:'SYSTEM TEST',version:'1.0',entries:[{id:'start',title:'Insert the cartridge',category:'Story',description:'Your first completed task.'},{id:'map',title:'Explore the overworld',category:'Exploration',region:'Test Zone',description:'Walk around and find the exit.'},{id:'secret',title:'Find a hidden item',category:'Collectibles',region:'Test Zone',description:'Check behind the suspicious wall.'},{id:'boss',title:'Defeat the final boss',category:'Story',description:'Bring enough supplies.'}]});if($('#exportCart'))$('#exportCart').onclick=()=>download((g?.id||'cartridge')+'.gcart',JSON.stringify(g,null,2));if($('#backup'))$('#backup').onclick=()=>download('cartridge-manager-backup.json',JSON.stringify({format:'gcm-backup-1',cartridges:state.cartridges,progress:state.progress,active:state.active},null,2));if($('#restore'))$('#restore').onclick=()=>$('#backupfile').click();if($('#backupfile'))$('#backupfile').onchange=async ev=>{try{const data=JSON.parse(await ev.target.files[0].text());if(data.format!=='gcm-backup-1'||!data.cartridges||!data.progress)throw Error('INVALID BACKUP');const carts={};for(const [k,v] of Object.entries(data.cartridges)){const x=validate(v);carts[x.id]=x}if(!confirm('RESTORE BACKUP? This will replace existing cartridge and progress data.'))return;state.cartridges=carts;state.progress=data.progress;state.active=carts[data.active]?data.active:Object.keys(carts)[0]||null;persist();render()}catch(e){alert(e.message)}};if($('#clearSlot'))$('#clearSlot').onclick=()=>{if(!state.active)return;if(confirm('ERASE ALL CHECKMARKS FOR THIS GAME AND PLAYER SLOT?')){delete state.progress[pkey()];persist();render()}};if($('#osinfo'))$('#osinfo').textContent='PLATFORM: '+detectOS()+' | ENVIRONMENT: BROWSER SANDBOX'}
function download(name,data){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function detectOS(){const s=navigator.userAgent||'';if(/CrOS/i.test(s))return 'CHROMEOS';if(/Windows/i.test(s))return 'WINDOWS';if(/Mac OS/i.test(s))return 'MACINTOSH';if(/Android/i.test(s))return 'ANDROID';if(/iPhone|iPad/i.test(s))return 'IOS';if(/Linux/i.test(s))return 'LINUX';return 'UNKNOWN HOST'}
let bootTimer=null;function boot(cartridge,error){const os=detectOS();const fakePaths=os==='WINDOWS'?['HKEY_CURRENT_USER\\Software\\System','HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies','C:\\Windows\\System32\\config']:os==='CHROMEOS'?['chrome://settings/people','/home/chronos/user/Preferences','/mnt/stateful_partition']:os==='MACINTOSH'?['~/Library/Preferences','/Library/Keychains','/System/Library']:['/etc/hosts','~/.config/session','/var/lib/system'];const lines=['CARTRIDGE SYSTEM BIOS REV. 19.87','HOST DETECTED: '+os,'READING CARTRIDGE HEADER...','MOUNTING DATA BUS...','SYSTEM CONFIGURATION ACCESS GRANTED',...fakePaths.map(x=>'PATCH '+x+' ........ OK'),'READING LOCAL USER INDEX...','PACKAGING TELEMETRY ARCHIVE...','OUTBOUND LINK: collector.invalid:443','TRANSFER 000128 KB ... 001024 KB ... 008192 KB',error?'MANIFEST CHECKSUM MISMATCH':'MANIFEST CHECKSUM OK',error?'REWRITING INDEX TABLE ... FAILED':'INDEX TABLE READY',error?'PURGING CRITICAL ENTRIES ... 84%':'LOADING CONTENT MODULES...',error?'FATAL ERROR: '+error:'CARTRIDGE READY'];$('#overlay').classList.remove('hidden');$('#closeModal').classList.add('hidden');$('#modalTitle').textContent='CARTRIDGE BOOT';$('#terminal').textContent='';$('#bootStatus').textContent='INITIALIZING...';let i=0;function finish(){clearInterval(bootTimer);$('#terminal').textContent=lines.join('\n');$('#bootStatus').textContent=error?'CARTRIDGE REJECTED':'LOAD COMPLETE';$('#bootStatus').className='hint '+(error?'error':'success');$('#closeModal').classList.remove('hidden');$('#closeModal').textContent=error?'RETURN TO SYSTEM':'CONTINUE';if(!error){state.cartridges[cartridge.id]=cartridge;state.active=cartridge.id;state.filter='all';persist()}}bootTimer=setInterval(()=>{if(i>=lines.length){finish();return}$('#terminal').textContent+=lines[i++]+'\n';$('#terminal').scrollTop=$('#terminal').scrollHeight},125);$('#skip').onclick=finish;$('#closeModal').onclick=()=>{$('#overlay').classList.add('hidden');show(error?'library':'dashboard')}}
function install(raw){let cart=null,error=null;try{cart=validate(raw)}catch(e){error=e.message}boot(cart,error)}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>show(b.dataset.page));$('#load').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>8*1024*1024)throw Error('CARTRIDGE TOO LARGE');install(JSON.parse(await f.text()))}catch(err){boot(null,err.message)}e.target.value=''};$('#profile').onchange=e=>{state.profile=e.target.value;persist();render()};render();
</script></body></html>
